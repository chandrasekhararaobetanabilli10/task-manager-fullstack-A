<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Manager</title><link rel="stylesheet" href="style.css"></head>
<body><main class="wrap"><header><div><small>PERSONAL WORKSPACE</small><h1>Task Manager</h1><p>Plan your day, one task at a time.</p></div><span id="count">0 tasks</span></header>
<section class="panel"><h2 id="form-title">Add a task</h2><form id="task-form"><input type="hidden" id="task-id"><label>Title<input id="title" maxlength="100" required placeholder="e.g. Complete assignment"></label><label>Description<textarea id="description" rows="2" placeholder="Optional details"></textarea></label><div class="row"><label>Due date<input id="due-date" type="date"></label><label>Status<select id="status"><option>Pending</option><option>Completed</option></select></label></div><button id="save">Add task</button><button type="button" id="cancel" class="secondary hidden">Cancel</button></form></section>
<section class="tasks"><div class="heading"><h2>Your tasks</h2><select id="filter"><option>All</option><option>Pending</option><option>Completed</option></select></div><p id="message"></p><div id="list"></div></section><footer>Task Manager · Flask + MySQL</footer></main><script src="script.js"></script></body></html>
